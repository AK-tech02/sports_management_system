{% extends 'base.html' %}{% block content %}<div class="top"><h1>Notifications</h1>{% if can.notify %}<a class="btn" href="{% url 'notification_add' %}">Send announcement</a>{% endif %}</div>
<div class="card">{% for n in notes %}<div class="note"><b>{{ n.title }}</b><br>{{ n.message }}<br><small>{{ n.created_by.username|default:"System" }}, {{ n.created_at|date:"j M Y, H:i" }}</small></div>{% empty %}<span class="mu">Nothing yet.</span>{% endfor %}</div>{% endblock %}
